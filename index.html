    <div class="contact-form">
      <form id="contactForm">

  <!-- Typed.js initialization -->
  <script>
    var typed = new Typed(".text", {
      strings: ["Frontend Developer", "Backend Developer", "Full Stack Developer", "Laravel Full Stack Developer"],
      typeSpeed: 50,

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>

  <!-- Firebase Script -->
  <script>
    // ✅ Replace this with your actual Firebase project config
   // For Firebase JS SDK v7.20.0 and later, measurementId is optional
    const firebaseConfig = {
    apiKey: "AIzaSyCX9S5xRC0axAeCLBuwt00ElHw-kOPt0kQ",
    authDomain: "dnyanushinde-2db93.firebaseapp.com",
    projectId: "dnyanushinde-2db93",
    storageBucket: "dnyanushinde-2db93.appspot.com",
    messagingSenderId: "950527526329",
    appId: "1:950527526329:web:17a2f560ee98c7fb74a268",
    measurementId: "G-HR7L70NVJ8"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Form Submission
    document.getElementById("contactForm").addEventListener("submit", function (e) {
      e.preventDefault();

      const name = e.target[0].value;
      const email = e.target[1].value;
      const topic = e.target[2].value;
      const message = e.target[3].value;

      db.collection("contacts")
        .add({
          name: name,
          email: email,
          topic: topic,
          message: message,
          timestamp: new Date()
        })
        .then(() => {
          alert("✅ Message submitted successfully!");
          e.target.reset();
        })
        .catch((error) => {
          console.error("❌ Error writing document: ", error);
          alert("❌ Failed to send message.");
        });
    });
  </script>
